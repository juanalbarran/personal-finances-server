databaseChangeLog:
  - changeSet:
      id: 20261116-00-create-user-account
      author: juan
      changes:
        - createTable:
            tableName: user_account
            remarks: The people who own the finances this application tracks
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(255)
                  remarks: Unique handle, used to look the user up
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_user_account_username
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_user_account_email
              - column:
                  name: name
                  type: VARCHAR(255)
                  remarks: First name
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
