databaseChangeLog:
  - changeSet:
      id: 20261117-00-create-category
      author: juan
      changes:
        - createTable:
            tableName: category
            remarks: The categories a user divides the monthly spends in
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_account_id
                  type: BIGINT
                  remarks: The user the category belongs to
                  constraints:
                    nullable: false
                    foreignKeyName: fk_category_user_account
                    references: user_account(id)
                    deleteCascade: true
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: category
            columnNames: user_account_id, name
            constraintName: uq_category_user_account_name
